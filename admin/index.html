<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%234f46e5'/%3E%3Cpath d='M18 24h28v22a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4z' fill='white' opacity='.9'/%3E%3Cpath d='M16 18h32v8H16z' fill='white'/%3E%3C/svg%3E" />
    <title>PropKart for Business · Admin</title>
    <script>
      // Apply the saved theme and accent before first paint (avoids a flash).
      try {
        var p = (JSON.parse(localStorage.getItem('proto:admin-ui') || '{}').state) || {}
        var dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (p.accent && p.accent !== 'indigo') document.documentElement.dataset.accent = p.accent
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
